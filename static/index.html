<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gmail Farmer Plus Style Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- Full-screen Loader -->
    <div id="loader" class="loader">
        <div style="width: 50px; height: 50px; border: 3px solid #1c1f2e; border-top: 3px solid #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
    </div>

    <!-- Side Menu Overlay -->
    <div id="side-menu" class="side-menu">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h3 style="font-size: 1.1rem; color: #fff;">Menu</h3>
            <i class="fas fa-times" style="cursor: pointer; color: #8b8e9f;" onclick="toggleMenu()"></i>
        </div>
        <div class="menu-item active" onclick="switchNav('overview')">
            <i class="fas fa-home"></i> <span>Overview</span>
        </div>
        <div class="menu-item" onclick="switchNav('settings')">
            <i class="fas fa-cog"></i> <span>Settings</span>
        </div>
        <div class="menu-item" onclick="switchNav('channels')">
            <i class="fas fa-bullhorn"></i> <span>Channels</span>
        </div>
        <div style="position: absolute; bottom: 30px; left: 20px; color: #4b5563; font-size: 0.7rem;">
            Billion Bot Dashboard v2.1
        </div>
    </div>

    <!-- Top Navigation Bar -->
    <header>
        <div class="menu-btn" onclick="toggleMenu()">
            <i class="fas fa-bars"></i>
        </div>
        <h1 id="page-title">Overview</h1>
        <div class="avatar" id="avatar-circle">B</div>
    </header>

    <div class="container">
        <!-- Dashboard View -->
        <section id="overview-section" class="view-section active">
            <!-- Users Section -->
            <div class="section-header">
                <i class="fas fa-users"></i>
                <h2>Users</h2>
            </div>
            <div class="stats-grid">
                <div class="card">
                    <span class="card-label">Total Users</span>
                    <span class="card-value val-blue" id="stat-total-users">0</span>
                </div>
                <div class="card">
                    <span class="card-label">Banned</span>
                    <span class="card-value val-red" id="stat-banned-users">0</span>
                </div>
            </div>

            <!-- Tasks Section -->
            <div class="section-header">
                <i class="fas fa-envelope"></i>
                <h2>Tasks</h2>
            </div>
            <div class="stats-grid">
                <div class="card">
                    <span class="card-label">Total Tasks</span>
                    <span class="card-value val-purple" id="stat-total-tasks">0</span>
                </div>
                <div class="card">
                    <span class="card-label">Approved</span>
                    <span class="card-value val-green" id="stat-completed-tasks">0</span>
                </div>
                <div class="card" style="margin-top: 12px;">
                    <span class="card-label">Pending</span>
                    <span class="card-value val-orange" id="stat-active-tasks">0</span>
                </div>
                <div class="card" style="margin-top: 12px;">
                    <span class="card-label">Rejected</span>
                    <span class="card-value val-red" id="stat-cancelled-tasks">0</span>
                </div>
            </div>
        </section>

        <!-- Settings View -->
        <section id="settings-section" class="view-section">
            <div class="section-header">
                <i class="fas fa-cog"></i>
                <h2>General Settings</h2>
            </div>
            <div class="card" style="min-height: auto; padding: 25px;">
                <div class="form-group">
                    <label>Transfer Fee (%)</label>
                    <input type="number" id="transfer-fee-input" class="input-field">
                </div>
                <div class="form-group">
                    <label>Daily Gift (Points)</label>
                    <input type="number" id="daily-gift-input" class="input-field">
                </div>
                <div class="form-group">
                    <label>Min Transfer Amount</label>
                    <input type="number" id="min-transfer-input" class="input-field">
                </div>
                <button class="primary-btn" onclick="saveSettings()">Save Configuration</button>
            </div>
        </section>

        <!-- Channels View -->
        <section id="channels-section" class="view-section">
            <div class="section-header">
                <i class="fas fa-bullhorn"></i>
                <h2>Mandatory Channels</h2>
            </div>
            <div id="channels-list">
                <!-- Injected via JS -->
            </div>
            <div class="card" style="margin-top: 20px; min-height: auto;">
                <div class="form-group">
                    <label>Add New Channel</label>
                    <input type="text" id="new-channel-id" class="input-field" placeholder="@username" style="margin-bottom: 10px;">
                    <input type="text" id="new-channel-link" class="input-field" placeholder="https://t.me/...">
                </div>
                <button class="primary-btn" onclick="addNewChannel()">Add Channel</button>
            </div>
        </section>
    </div>

    <!-- Centered Footer Bar -->
    <div class="footer-wrap">
        <span class="footer-text">@Billion_Bot</span>
    </div>

    <style>
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
    <script src="/static/app.js"></script>
</body>
</html>
