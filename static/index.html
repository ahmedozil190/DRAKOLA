<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Billion Bot - Admin Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css?v=12">
</head>

<body>
    <!-- Full Screen Loader -->
    <div id="loader" class="loader">
        <div class="avatar" style="width: 60px; height: 60px; font-size: 1.5rem;">B</div>
    </div>

    <!-- Header / Page Title -->
    <header>
        <div class="menu-btn" onclick="toggleMenu()">
            <i class="fa-solid fa-bars"></i>
        </div>
        <h1 id="page-title">لوحة التحكم</h1>
        <div class="avatar" id="avatar-circle">A</div>
    </header>

    <!-- Side Menu Overlay -->
    <div class="menu-overlay" id="menu-overlay" onclick="toggleMenu()"></div>

    <!-- Side Menu -->
    <nav class="side-menu" id="side-menu">
        <div class="side-menu-header">
            <span class="side-menu-title">Billion Bot</span>
            <div class="close-circle" onclick="toggleMenu()">
                <i class="fa-solid fa-xmark"></i>
            </div>
        </div>
        <div class="menu-nav" style="padding: 10px;">
            <div class="menu-item active" onclick="switchNav('overview')">
                <i class="fa-solid fa-chart-pie"></i>
                <span>الرئيسية</span>
            </div>
            <div class="menu-item" onclick="switchNav('users')">
                <i class="fa-solid fa-users"></i>
                <span>المستخدمين</span>
            </div>
            <div class="menu-item" onclick="switchNav('channels')">
                <i class="fa-solid fa-link"></i>
                <span>القنوات</span>
            </div>
            <div class="menu-item" onclick="switchNav('settings')">
                <i class="fa-solid fa-gear"></i>
                <span>الإعدادات</span>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <div class="container">
        
        <!-- Overview Section -->
        <div id="overview-section" class="view-section active">
            <div class="stats-grid">
                <div class="glass-card stat-card blue">
                    <div class="stat-title">المستخدمين</div>
                    <div class="stat-value" id="stat-total-users">0</div>
                </div>
                <div class="glass-card stat-card purple">
                    <div class="stat-title">المحظورين</div>
                    <div class="stat-value" id="stat-banned-users">0</div>
                </div>
                <div class="glass-card stat-card green">
                    <div class="stat-title">المهام المكتملة</div>
                    <div class="stat-value" id="stat-completed-tasks">0</div>
                </div>
                <div class="glass-card stat-card amber">
                    <div class="stat-title">قيد التنفيذ</div>
                    <div class="stat-value" id="stat-active-tasks">0</div>
                </div>
            </div>
        </div>

        <!-- Users Section -->
        <div id="users-section" class="view-section">
            <div class="glass-card" style="padding: 1.25rem; margin-bottom: 2rem;">
                <!-- Filter Tabs -->
                <div style="display: flex; gap: 4px; background: rgba(0,0,0,0.2); padding: 4px; border-radius: 12px; margin-bottom: 1.5rem;">
                    <button id="tab-all" class="tab-btn active" onclick="setUserFilter('all')">الكل</button>
                    <button id="tab-banned" class="tab-btn" onclick="setUserFilter('banned')">المحظورين</button>
                </div>

                <!-- Search Box -->
                <div style="display: flex; flex-direction: column; gap: 12px;">
                    <div style="position: relative;">
                        <input type="text" id="user-search" placeholder="ابحث بالاسم أو الآيدي..." class="form-control" oninput="filterUsers()">
                    </div>
                    <button class="primary-btn" onclick="filterUsers()" style="height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 8px;">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <span>بحث</span>
                    </button>
                </div>
            </div>

            <div class="glass-card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <h2 style="margin: 0; font-size: 1.1rem; color: #fff;">إدارة المستخدمين</h2>
                    <span id="users-count-badge" style="font-size: 0.75rem; opacity: 0.6; background: rgba(255,255,255,0.05); padding: 4px 10px; border-radius: 20px;">0 results</span>
                </div>
                <div id="users-list" class="table-container">
                    <!-- Cards will be injected by app.js -->
                </div>
            </div>
        </div>

        <!-- Settings Section Task: placeholder items -->
        <div id="settings-section" class="view-section">
            <div class="glass-card">
                <h2>إعدادات البوت</h2>
                <div class="form-group">
                    <label>عمولة التحويل</label>
                    <input type="number" id="transfer-fee-input" class="form-control">
                </div>
                <div class="form-group">
                    <label>الهدية اليومية</label>
                    <input type="number" id="daily-gift-input" class="form-control">
                </div>
                <div class="form-group">
                    <label>الحد الأدنى للتحويل</label>
                    <input type="number" id="min-transfer-input" class="form-control">
                </div>
                <button class="primary-btn" onclick="saveSettings()">حفظ التغييرات</button>
            </div>
        </div>

        <!-- Channels Section -->
        <div id="channels-section" class="view-section">
            <div class="glass-card">
                <h2>إضافة قناة جديدة</h2>
                <div class="form-group">
                    <label>آيدي القناة</label>
                    <input type="text" id="new-channel-id" class="form-control" placeholder="-100...">
                </div>
                <div class="form-group">
                    <label>رابط القناة</label>
                    <input type="text" id="new-channel-link" class="form-control" placeholder="https://t.me/...">
                </div>
                <button class="primary-btn" onclick="addNewChannel()">إضافة القناة</button>
            </div>
            <div id="channels-list"></div>
        </div>

    </div>

    <script src="/static/app.js?v=12"></script>
</body>

</html>
