<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gmail Farmer Plus Style Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css?v=11">
</head>

<body>
    <!-- Full-screen Loader -->
    <div id="loader" class="loader">
        <div
            style="width: 50px; height: 50px; border: 3px solid #1c1f2e; border-top: 3px solid #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite;">
        </div>
    </div>

    <!-- Side Menu Overlay -->
    <div id="menu-overlay" class="menu-overlay" onclick="toggleMenu()"></div>

    <!-- Side Menu Sidebar -->
    <div id="side-menu" class="side-menu">
        <div class="side-menu-header">
            <h3 class="side-menu-title">Billion Bot Plus</h3>
            <div class="close-circle" onclick="toggleMenu()">
                <i class="fas fa-times"></i>
            </div>
        </div>
        <div class="menu-item active" onclick="switchNav('overview')">
            <i class="fas fa-chart-pie"></i> <span>Home</span>
        </div>
        <div class="menu-item" onclick="switchNav('users')">
            <i class="fas fa-users"></i> <span>Users</span>
        </div>
        <div class="menu-item" onclick="switchNav('settings')">
            <i class="fas fa-cog"></i> <span>Settings</span>
        </div>
        <div class="menu-item" onclick="switchNav('channels')">
            <i class="fas fa-bullhorn"></i> <span>Channels</span>
        </div>
    </div>

    <!-- Top Navigation Bar -->
    <header>
        <div class="menu-btn" onclick="toggleMenu()">
            <i class="fas fa-bars"></i>
        </div>
        <h1 id="page-title">Overview</h1>
        <div class="avatar" id="avatar-circle">B</div>
    </header>

    <div class="container">
        <!-- Dashboard View -->
        <section id="overview-section" class="view-section active">
            <!-- Users Section -->
            <div class="section-header">
                <i class="fas fa-users"></i>
                <h2>Users</h2>
            </div>
            <div class="stats-grid">
                <div class="card">
                    <span class="card-label">Total Users</span>
                    <span class="card-value val-blue" id="stat-total-users">0</span>
                </div>
                <div class="card">
                    <span class="card-label">Banned</span>
                    <span class="card-value val-red" id="stat-banned-users">0</span>
                </div>
            </div>

            <!-- Tasks Section -->
            <div class="section-header">
                <i class="fas fa-envelope"></i>
                <h2>Orders</h2>
            </div>
            <div class="stats-grid">
                <div class="card">
                    <span class="card-label">Total Orders</span>
                    <span class="card-value val-purple" id="stat-total-tasks">0</span>
                </div>
                <div class="card">
                    <span class="card-label">Approved</span>
                    <span class="card-value val-green" id="stat-completed-tasks">0</span>
                </div>
                <div class="card" style="margin-top: 12px;">
                    <span class="card-label">Pending</span>
                    <span class="card-value val-orange" id="stat-active-tasks">0</span>
                </div>
                <div class="card" style="margin-top: 12px;">
                    <span class="card-label">Rejected</span>
                    <span class="card-value val-red" id="stat-cancelled-tasks">0</span>
                </div>
            </div>
        </section>

        <!-- Users Section -->
        <section id="users-section" class="view-section">
            <div class="stats-grid" style="grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px;">
                <!-- Total Users Card -->
                <div class="card" 
                    style="padding: 18px; text-align: center; background: rgba(30, 41, 59, 0.5); border: 1px solid rgba(59, 130, 246, 0.2); border-radius: 20px; display: flex; flex-direction: column; justify-content: center;">
                    <div class="card-label" style="font-size: 0.75rem; color: #94a3b8; font-weight: 700; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;">TOTAL USERS</div>
                    <div class="card-value" id="user-stat-total" style="font-size: 1.8rem; color: #60a5fa; font-weight: 800;">14</div>
                </div>
                <!-- Banned Users Card -->
                <div class="card" 
                    style="padding: 18px; text-align: center; background: rgba(69, 10, 10, 0.2); border: 1px solid rgba(239, 68, 68, 0.2); border-radius: 20px; display: flex; flex-direction: column; justify-content: center;">
                    <div class="card-label" style="font-size: 0.75rem; color: #94a3b8; font-weight: 700; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;">BANNED</div>
                    <div class="card-value" id="user-stat-banned" style="font-size: 1.8rem; color: #ef4444; font-weight: 800;">1</div>
                </div>
            </div>

            <!-- Search & Tabs Consolidated Container -->
            <div class="card" style="padding: 25px; margin-bottom: 25px; background: #0f111a; border: 1px solid rgba(255,255,255,0.03); border-radius: 24px;">
                <!-- Tabs -->
                <div class="tabs-row" style="display: flex; gap: 8px; margin-bottom: 25px; background: rgba(0,0,0,0.4); padding: 6px; border-radius: 14px;">
                    <button class="tab-btn active" id="tab-all" onclick="setUserFilter('all')"
                        style="flex: 1; padding: 12px; border-radius: 10px; border: none; background: #60a5fa; color: #fff; font-weight: 700; font-size: 0.95rem;">All</button>
                    <button class="tab-btn" id="tab-banned" onclick="setUserFilter('banned')"
                        style="flex: 1; padding: 12px; border-radius: 10px; border: none; background: transparent; color: #94a3b8; font-weight: 700; font-size: 0.95rem;">Banned</button>
                </div>

                <!-- Search Input -->
                <div class="search-box-v2" style="margin-bottom: 18px;">
                    <input type="text" id="user-search" placeholder="Search users..." oninput="filterUsers()"
                        style="width: 100%; padding: 15px; background: #0a0b11; border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; color: #fff; font-size: 1rem; outline: none;">
                </div>

                <!-- Find Button -->
                <button onclick="filterUsers()" class="gradient-btn"
                    style="width: 100%; padding: 15px; background: linear-gradient(135deg, #60a5fa, #a855f7); border: none; border-radius: 14px; color: #fff; font-weight: 700; font-size: 1rem; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 4px 15px rgba(96, 165, 250, 0.2);">
                    <i class="fas fa-search"></i> Find
                </button>
            </div>

            <div class="card" style="margin-top: 20px;">
                <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 5px;">
                    <h3 style="font-size: 1rem; font-weight: 700;">User Management</h3>
                    <span id="users-count-badge"
                        style="background: rgba(255,255,255,0.05); padding: 4px 10px; border-radius: 12px; font-size: 0.7rem; color: var(--text-muted);">0
                        results</span>
                </div>

                <div id="users-list">
                    <!-- Premium cards will be injected here -->
                </div>

                <div class="pagination"
                    style="display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 20px; padding: 10px;">
                    <button class="nav-arrow"
                        style="background: rgba(255,255,255,0.05); border: none; width: 40px; height: 40px; border-radius: 12px; color: var(--text-muted);"><i
                            class="fas fa-chevron-left"></i></button>
                    <span style="font-size: 0.9rem; font-weight: 600; color: #fff;">Page 1 of 1</span>
                    <button class="nav-arrow"
                        style="background: rgba(255,255,255,0.05); border: none; width: 40px; height: 40px; border-radius: 12px; color: var(--text-muted);"><i
                            class="fas fa-chevron-right"></i></button>
                </div>
            </div>
        </section>

        <!-- Settings View -->
        <section id="settings-section" class="view-section">
            <div class="section-header">
                <i class="fas fa-cog"></i>
                <h2>General Settings</h2>
            </div>
            <div class="card" style="min-height: auto; padding: 25px;">
                <div class="form-group">
                    <label>Transfer Fee (%)</label>
                    <input type="number" id="transfer-fee-input" class="input-field">
                </div>
                <div class="form-group">
                    <label>Daily Gift (Points)</label>
                    <input type="number" id="daily-gift-input" class="input-field">
                </div>
                <div class="form-group">
                    <label>Min Transfer Amount</label>
                    <input type="number" id="min-transfer-input" class="input-field">
                </div>
                <button class="primary-btn" onclick="saveSettings()">Save Configuration</button>
            </div>
        </section>

        <!-- Channels View -->
        <section id="channels-section" class="view-section">
            <div class="section-header">
                <i class="fas fa-bullhorn"></i>
                <h2>Mandatory Channels</h2>
            </div>
            <div id="channels-list">
                <!-- Injected via JS -->
            </div>
            <div class="card" style="margin-top: 20px; min-height: auto;">
                <div class="form-group">
                    <label>Add New Channel</label>
                    <input type="text" id="new-channel-id" class="input-field" placeholder="@username"
                        style="margin-bottom: 10px;">
                    <input type="text" id="new-channel-link" class="input-field" placeholder="https://t.me/...">
                </div>
                <button class="primary-btn" onclick="addNewChannel()">Add Channel</button>
            </div>
        </section>
    </div>


    <style>
        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
    <script src="/static/app.js?v=10"></script>
</body>

</html>
